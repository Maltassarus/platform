version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blog_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: blog
      DB_SSLMODE: disable
      JWT_SECRET: nbfMDrQ7xV0rVa5Qo1paArT/sQzgGT1nyYkJ0G7g2zQ=
      SERVER_PORT: 8080
      PUBLISH_CHECK_INTERVAL: 10
      WORKER_POOL_SIZE: 5
    volumes:
      - ./migrations:/app/migrations

volumes:
  postgres_data: